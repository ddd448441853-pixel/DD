# 每小时盯盘检查（UTC 每小时第 5 分钟，正好是 Binance 1h K 线收盘之后）
name: check-market

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:            # 也支持在 GitHub 页面上手动点「Run workflow」

permissions:
  contents: write               # 允许把运行状态写回仓库（保存记忆）

concurrency:
  group: trading-bot
  cancel-in-progress: false     # 上一次没跑完就排队，避免状态互相覆盖

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 盯盘检查
        env:
          PYTHONUTF8: "1"
          PUSH_CHANNEL: serverchan
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
        run: python main.py check
      - name: 保存运行状态（记忆）
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 更新盯盘状态 $(date -u +%FT%TZ)"
          git push
