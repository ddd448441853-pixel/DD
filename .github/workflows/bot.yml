name: trading-bot
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trading-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 盯盘检查（+9点复盘）
        env:
          PYTHONUTF8: "1"
          PUSH_CHANNEL: serverchan
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
        run: |
          python main.py check
          if [ "$(date -u +%H)" = "01" ]; then
            python main.py review
          fi
      - name: 保存运行状态
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 更新状态 $(date -u +%FT%TZ)"
          git push
