name: trading-bot-ashare

on:
  schedule:
    - cron: "35 2 * * 1-5"
    - cron: "35 3 * * 1-5"
    - cron: "5 6 * * 1-5"
    - cron: "5 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: A 股盯盘
        env:
          PYTHONUTF8: "1"
          PUSH_CHANNEL: serverchan
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
        run: python ashare_main.py check
      - name: 保存运行状态
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: ashare $(date -u +%FT%TZ)"
          git push
